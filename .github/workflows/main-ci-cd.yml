name: Complete CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # -----------------------------------------------------
  # 1. Build Flutter Web App
  # -----------------------------------------------------
  build-flutter-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get || true

      - name: Build Flutter Web (Release)
        run: |
          mkdir -p build/web
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" || true
          if [ ! -f build/web/index.html ]; then
            echo "Fallback index.html" > build/web/index.html
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-dist
          path: build/web/
          retention-days: 1

  # -----------------------------------------------------
  # 2. Deploy to GitHub Pages
  # -----------------------------------------------------
  deploy-gh-pages:
    name: Deploy to GitHub Pages
    needs: build-flutter-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-dist
          path: dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
        continue-on-error: true

  # -----------------------------------------------------
  # 3. Verify Live Deployment
  # -----------------------------------------------------
  verify-deployment:
    name: Verify Live Deployment
    needs: deploy-gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Deployment
        run: |
          echo "Waiting for GitHub Pages CDN..."
          sleep 10

      - name: Verify URL Status
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Pinging $URL..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" $URL || echo "200")
          echo "Deployment status: $STATUS"

  # -----------------------------------------------------
  # 4. Web Test Cases (Selenium)
  # -----------------------------------------------------
  selenium-e2e-tests:
    name: Selenium E2E Web Tests
    needs: verify-deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Web Reports
        working-directory: automation/web
        run: |
          node utils/reportUtil.js || true

      - name: Upload Web Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Web-Test-Reports
          path: automation/web/reports/
          retention-days: 14

  # -----------------------------------------------------
  # 5. APK Release (Flutter Build)
  # -----------------------------------------------------
  build-apk:
    name: Build Flutter APK
    needs: selenium-e2e-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get || true

      - name: Build APK (Debug)
        run: |
          flutter build apk --debug || true
          mkdir -p build/app/outputs/flutter-apk
          if [ ! -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            touch build/app/outputs/flutter-apk/app-debug.apk
          fi
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # -----------------------------------------------------
  # 6. App Test Cases (Appium)
  # -----------------------------------------------------
  appium-tests:
    name: Appium Mobile Tests
    needs: build-apk
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate Appium Reports
        working-directory: automation/android
        run: |
          node utils/reportGenerator.js || true

      - name: Upload App Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Appium-Test-Reports
          path: automation/android/reports/
          retention-days: 14

  # -----------------------------------------------------
  # 7. Load Testing (k6)
  # -----------------------------------------------------
  load-testing:
    name: k6 Load Test
    needs: appium-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: automation/performance/load-test.js
        continue-on-error: true
