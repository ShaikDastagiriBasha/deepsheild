name: deepshield

description: "DeepShield AI KYC Verification App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # CAMERA
  camera: ^0.11.0+2

  # IMAGE PICKER
  image_picker: ^1.1.2
  tflite_flutter: ^0.12.1
  image: ^4.2.0

  # PATH PROVIDER
  path_provider: ^2.1.3

  # FIREBASE
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11

  # ML KIT
  google_mlkit_face_detection: ^0.9.0
  google_mlkit_text_recognition: ^0.11.0
  google_mlkit_commons: ^0.6.0

  # NETWORK
  http: ^0.13.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/mobilefacenet.tflite